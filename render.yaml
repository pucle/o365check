# Blueprint Render Free. Secrets đặt tay trên dashboard (sync: false).
# Không khai báo disk, GPU, hay instance trả phí.
services:
  - type: web
    name: club-attendance
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TZ_NAME
        value: Asia/Ho_Chi_Minh
      - key: APP_ENV
        value: production
      - key: MODEL_NAME
        value: buffalo_s
      - key: SKIP_MODEL_WARMUP
        value: "1"
      - key: FACE_MAX_CONCURRENCY
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: INSIGHTFACE_HOME
        value: /home/user/.insightface
